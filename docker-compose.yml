services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notify}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-notify}:${POSTGRES_PASSWORD:-notify}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      PORT: "8080"
      PROVIDER_URL: ${PROVIDER_URL:-https://webhook.site/your-unique-id}
      DATABASE_URL: postgres://${POSTGRES_USER:-notify}:${POSTGRES_PASSWORD:-notify}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./api:/spec:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"

volumes:
  postgres-data:
